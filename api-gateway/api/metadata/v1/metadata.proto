syntax = "proto3";

package metadata.v1;

option go_package = "api-gateway/api/metadata/v1;v1";

// The metadata service is responsible for managing article metadata.
service Metadata {
  // Retrieves a single article's metadata by its ID.
  rpc GetArticle (GetArticleRequest) returns (Article);

  // Retrieves a list of articles, with optional filtering and pagination.
  rpc ListArticles (ListArticlesRequest) returns (ListArticlesResponse);
}

// Represents the metadata for a single article.
// Note: The actual content is stored elsewhere and managed by the FileManagementService.
message Article {
  string id = 1;
  string title = 2;
  string version = 3;
  string format = 4; // e.g., "markdown" or "typst"
  string author_id = 5;
  repeated string tags = 6;
  int64 created_at = 7; // Unix timestamp
  int64 updated_at = 8; // Unix timestamp
}

// Request to get a single article.
message GetArticleRequest {
  string id = 1;
}

// Request to list articles.
message ListArticlesRequest {
  optional string tag = 1;
  optional int32 limit = 2;
  optional int32 offset = 3;
}

// Response for a list of articles.
message ListArticlesResponse {
  repeated Article articles = 1;
}
