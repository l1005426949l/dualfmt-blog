syntax = "proto3";

package gateway.v1;

import "google/api/annotations.proto";

option go_package = "api-gateway/api/gateway/v1;v1";

// The gateway service definition.
// This service is exposed to the outside world.
service Gateway {
  // Get a single article by its ID.
  rpc GetArticle (GetArticleRequest) returns (Article) {
    option (google.api.http) = {
      get: "/v1/articles/{id}"
    };
  }

  // List articles with optional filtering.
  rpc ListArticles (ListArticlesRequest) returns (ListArticlesResponse) {
    option (google.api.http) = {
      get: "/v1/articles"
    };
  }

  // Upload a new article. This is likely used by the CLI.
  rpc UploadArticle(UploadArticleRequest) returns (UploadArticleResponse) {}
}

// Represents a single article's metadata and content.
message Article {
  string id = 1;
  string title = 2;
  string content = 3;
  string version = 4;
  string format = 5; // e.g., "markdown" or "typst"
}

// Request message for GetArticle.
message GetArticleRequest {
  // The ID of the article to retrieve.
  string id = 1;
}

// Request message for ListArticles.
message ListArticlesRequest {
  // Optional tag to filter articles by.
  optional string tag = 1;
  // Optional limit for pagination.
  optional int32 limit = 2;
}

// Response message for ListArticles.
message ListArticlesResponse {
  repeated Article articles = 1;
}

// Request message for UploadArticle.
message UploadArticleRequest {
    string filename = 1;
    bytes content = 2;
    string format = 3;
}

// Response message for UploadArticle.
message UploadArticleResponse {
    string id = 1;
    string version = 2;
}
