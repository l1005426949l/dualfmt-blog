syntax = "proto3";
package conf;

option go_package = "file-management-service/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Minio {
    string endpoint = 1;
    string access_key_id = 2;
    string secret_access_key = 3;
    bool use_ssl = 4;
  }
  message Kafka {
    string addrs = 1;
  }
  Minio minio = 1;
  Kafka kafka = 2;
}

// google/protobuf/duration.proto
import "google/protobuf/duration.proto";
